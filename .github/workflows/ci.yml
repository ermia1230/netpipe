name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw compile

      - name: Unit tests
        run: ./mvnw test

      - name: Integration tests + coverage
        run: ./mvnw verify

      - name: Static analysis
        run: ./mvnw checkstyle:check spotbugs:check pmd:check
        continue-on-error: true

      - name: Package
        run: ./mvnw package -DskipTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t secure-netpipe .

      - name: Docker Compose up
        run: timeout 30s docker compose up --build --abort-on-container-exit || true
